name: Export current Feed the Frog v0.9.1 generated source

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/export-current-v091-source.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract clean source
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 1 -type f -name 'FeedTheFrog-Android-*.zip' | sort | tail -n 1)"
          test -n "$ZIP_FILE"
          rm -rf extracted
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

      - name: Recreate current v0.9.1 source
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_FILE="$(find extracted -type f \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) | head -n 1)"
          PROJECT_DIR="$(dirname "$PROJECT_FILE")"
          MAIN_FILE="$PROJECT_DIR/app/src/main/java/com/feedthefrog/game/MainActivity.kt"
          MANIFEST="$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          DRAWABLE_DIR="$PROJECT_DIR/app/src/main/res/drawable-nodpi"
          MIPMAP_DIR="$PROJECT_DIR/app/src/main/res/mipmap-nodpi"

          if [ -f "$PROJECT_DIR/app/src/main/res/raw/catch.ogg" ]; then
            mv "$PROJECT_DIR/app/src/main/res/raw/catch.ogg" "$PROJECT_DIR/app/src/main/res/raw/catch_sound.ogg"
            sed -i 's/R\.raw\.catch/R.raw.catch_sound/g' "$MAIN_FILE"
          fi

          sed -i '/^import androidx\.compose\.foundation\.layout\.weight$/d' "$MAIN_FILE"
          python3 "$GITHUB_WORKSPACE/patch_tap_game.py" "$MAIN_FILE"
          python3 "$GITHUB_WORKSPACE/patch_gameplay_v2.py" "$MAIN_FILE"
          python3 "$GITHUB_WORKSPACE/patch_ui_art_costs.py" "$MAIN_FILE" "$PROJECT_DIR"
          python3 "$GITHUB_WORKSPACE/patch_tv_subscription.py" "$MAIN_FILE" "$PROJECT_DIR"
          python3 "$GITHUB_WORKSPACE/patch_gameplay_v3.py" "$MAIN_FILE" "$PROJECT_DIR"
          python3 "$GITHUB_WORKSPACE/patch_gameplay_v4.py" "$MAIN_FILE"
          python3 "$GITHUB_WORKSPACE/patch_gameplay_v5.py" "$MAIN_FILE" "$PROJECT_DIR"
          python3 "$GITHUB_WORKSPACE/prepare_v8_assets.py"
          python3 "$GITHUB_WORKSPACE/patch_v6_preflight.py" "$MAIN_FILE"
          python3 "$GITHUB_WORKSPACE/patch_gameplay_v6.py" "$MAIN_FILE" "$PROJECT_DIR"
          python3 "$GITHUB_WORKSPACE/patch_tv_v2.py" "$MAIN_FILE" "$PROJECT_DIR"
          python3 "$GITHUB_WORKSPACE/patch_compile_fix.py" "$MAIN_FILE"
          python3 "$GITHUB_WORKSPACE/prepare_v9_assets.py"
          python3 "$GITHUB_WORKSPACE/patch_gameplay_v7.py" "$MAIN_FILE" "$PROJECT_DIR"
          python3 "$GITHUB_WORKSPACE/prepare_v11_assets.py"
          python3 "$GITHUB_WORKSPACE/patch_gameplay_v8.py" "$MAIN_FILE" "$PROJECT_DIR"
          python3 "$GITHUB_WORKSPACE/patch_home_final.py" "$MAIN_FILE"
          python3 "$GITHUB_WORKSPACE/patch_home_png_resource.py" "$PROJECT_DIR"
          python3 "$GITHUB_WORKSPACE/binary_assets_v11/patch_fake_commercials_v1.py" "$MAIN_FILE" "$PROJECT_DIR"

          python3 "$GITHUB_WORKSPACE/prepare_v10_assets.py"
          mkdir -p "$DRAWABLE_DIR" "$MIPMAP_DIR"
          cp "$GITHUB_WORKSPACE/generated_assets_v10/ftf_home_frog.png" "$DRAWABLE_DIR/ftf_home_frog.png"
          cp "$GITHUB_WORKSPACE/generated_assets_v10/frog_helmet.png" "$DRAWABLE_DIR/frog_helmet.png"
          cp "$GITHUB_WORKSPACE/generated_assets_v10/ftf_poison_frog.png" "$DRAWABLE_DIR/ftf_poison_frog.png"
          rm -f "$DRAWABLE_DIR/ftf_home_frog.webp" "$DRAWABLE_DIR/frog_helmet.webp" "$DRAWABLE_DIR/ftf_poison_frog.webp"
          cp "$DRAWABLE_DIR/ftf_home_frog.png" "$MIPMAP_DIR/ftf_launcher.png"
          sed -i 's#android:icon="@drawable/ftf_home_frog"#android:icon="@mipmap/ftf_launcher"#' "$MANIFEST"
          sed -i 's#android:roundIcon="@drawable/ftf_home_frog"#android:roundIcon="@mipmap/ftf_launcher"#' "$MANIFEST"

          mkdir -p current-v091-source
          cp "$MAIN_FILE" current-v091-source/MainActivity.kt
          cp "$PROJECT_DIR/app/src/main/java/com/feedthefrog/game/CommercialSystem.kt" current-v091-source/CommercialSystem.kt
          cp "$PROJECT_DIR/app/src/main/java/com/feedthefrog/game/BillingSystem.kt" current-v091-source/BillingSystem.kt
          cp "$PROJECT_DIR/app/build.gradle.kts" current-v091-source/build.gradle.kts
          cp "$PROJECT_DIR/app/src/main/AndroidManifest.xml" current-v091-source/AndroidManifest.xml

      - name: Upload generated source
        uses: actions/upload-artifact@v4
        with:
          name: FeedTheFrog-v0.9.1-generated-source
          path: current-v091-source
          if-no-files-found: error
          retention-days: 3
