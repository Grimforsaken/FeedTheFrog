name: Build Frog Band Frantic Frog APK

on:
  push:
    branches:
      - frog-band-frantic-frog-v004
    paths:
      - "frog-band-prototype/audio_b64/READY"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          validate-wrappers: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Reconstruct Frantic Frog charts and embedded song
        shell: bash
        run: |
          set -euo pipefail
          RAW="frog-band-prototype/app/src/main/res/raw"
          mkdir -p "$RAW"

          base64 --decode frog-band-prototype/chart_b64/guitar.txt | gzip -dc > "$RAW/guitar_chart.csv"
          base64 --decode frog-band-prototype/chart_b64/drums.txt | gzip -dc > "$RAW/drums_chart.csv"
          cat frog-band-prototype/audio_b64/part_*.txt | base64 --decode > "$RAW/frantic_frog_mix.opus"

          test -s "$RAW/guitar_chart.csv"
          test -s "$RAW/drums_chart.csv"
          test -s "$RAW/frantic_frog_mix.opus"
          grep -q '^time_ms,lane,duration_ms' "$RAW/guitar_chart.csv"
          grep -q '^time_ms,lane,duration_ms' "$RAW/drums_chart.csv"
          ls -lh "$RAW/guitar_chart.csv" "$RAW/drums_chart.csv" "$RAW/frantic_frog_mix.opus"

      - name: Build Frog Band debug APK
        shell: bash
        working-directory: frog-band-prototype
        run: gradle --no-daemon --console=plain clean :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="frog-band-prototype/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          cp "$APK" FrogBand-v0.4-frantic-frog.apk
          unzip -t FrogBand-v0.4-frantic-frog.apk >/dev/null
          unzip -l FrogBand-v0.4-frantic-frog.apk > apk-contents.txt
          grep -q 'frantic_frog_mix' apk-contents.txt
          grep -q 'guitar_chart' apk-contents.txt
          grep -q 'drums_chart' apk-contents.txt
          ls -lh FrogBand-v0.4-frantic-frog.apk

      - name: Upload Frog Band APK
        uses: actions/upload-artifact@v4
        with:
          name: FrogBand-v0.4-frantic-frog
          path: FrogBand-v0.4-frantic-frog.apk
          if-no-files-found: error
          retention-days: 30
