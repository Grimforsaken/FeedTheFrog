name: Build Feed the Frog v0.9.4 TV Menu Pages

on:
  workflow_dispatch:
  push:
    branches:
      - v094-release
    paths:
      - "binary_assets_v15/**"
      - ".github/workflows/build-v094-tv-menu-pages.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout v0.9.4 branch
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Accept Android SDK licenses
        shell: bash
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Reconstruct and run verified v0.9.4 build driver
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d | gzip -d > /tmp/v094_build.sh
          chmod +x /tmp/v094_build.sh
          /tmp/v094_build.sh

      - name: Upload verified v0.9.4 APK
        uses: actions/upload-artifact@v4
        with:
          name: FeedTheFrog-TV-v0.9.4-tv-menu-pages
          path: /tmp/FeedTheFrog-TV-v0.9.4-tv-menu-pages.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload generated v0.9.4 source for audit
        uses: actions/upload-artifact@v4
        with:
          name: FeedTheFrog-v0.9.4-generated-source
          path: |
            extracted/**/app/src/main/java/com/feedthefrog/game/MainActivity.kt
            extracted/**/app/src/main/java/com/feedthefrog/game/CommercialSystem.kt
            extracted/**/app/src/main/java/com/feedthefrog/game/BillingSystem.kt
            extracted/**/app/build.gradle.kts
          if-no-files-found: error
          retention-days: 7
