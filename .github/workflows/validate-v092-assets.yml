name: Validate v0.9.2 Assets

on:
  workflow_dispatch:
  push:
    branches:
      - v092-update
    paths:
      - ".github/workflows/validate-v092-assets.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate every Base64 chunk and reconstructed ZIP
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, zipfile

          expected = {
              0: (8000, 'a3473679ad976092fd0e6ae156b3b268b6c721acd1b7004e568ec0065ca49482'),
              1: (8000, 'a28ef377b7c2dc28c981e5c1ac95f9129638cd662920637c28fb236b6f06d3fa'),
              2: (8000, 'e682f0be1da738eb66b5df5a174652742b18199871c79afbfa618eabea54137d'),
              3: (8000, '0306ccc61f72162e4baa9d7a520cadd8aa77cd0c202e8d4a3ed24b802fe73131'),
              4: (8000, '4239064c91c10e20c72be4157373c56a5ff46c1b2be431a283459f12038ced02'),
              5: (8000, 'f2811ca2afe9a17f5aa2e13bca812ad2dae5bc31586bb1913e79e19ea4a137e0'),
              6: (8000, 'cb296b03fe854bc436336497ecc9e71e8fadede9df08598e55b7d3c127353147'),
              7: (8000, 'e6a28247def8ee51bff5e8c88bf909e8e493418bbc627f64fc514ea04b985613'),
              8: (8000, 'edf7001eda243c9d4e5763cd69b7238c584196f0ce7356d77322e4f2e71b3d1d'),
              9: (8000, '12dc9f7a963feb075dbd5196653ddca49de0eed3a18e08c1a2b5581adc8de2c7'),
              10: (8000, '6c87471bced5d5712926ff9a6c55cfc4fee62771c5e7c8684edb888ab62bfaac'),
              11: (8000, '03556ed52344f026c403b1e3430b10a4b057d404c2ed484b8e75969d4f58c347'),
              12: (8000, '32bd2cded811290939ee20609c20032237ee2ce224e9468dddfea98c2fc1ea43'),
              13: (6024, '71a9def68600c2a42eae91bfaceca6f4f8f9e71a3a3743cde651a1b903a8bb23'),
          }
          parts=[]
          for i in range(14):
              p=Path(f'binary_assets_v14/v092_assets_{i:02d}.b64part')
              s=''.join(p.read_text().split())
              h=hashlib.sha256(s.encode()).hexdigest()
              print(f'chunk {i:02d}: length={len(s)} sha256={h}')
              if (len(s),h) != expected[i]:
                  raise SystemExit(f'BAD CHUNK {i:02d}: expected {expected[i]}')
              parts.append(s)
          text=''.join(parts)
          print('combined chars', len(text))
          if len(text) != 110024:
              raise SystemExit(f'combined Base64 length wrong: {len(text)}')
          data=base64.b64decode(text, validate=True)
          digest=hashlib.sha256(data).hexdigest()
          print('ZIP bytes',len(data),'sha256',digest)
          if len(data) != 82516 or digest != 'ab3bacd3c280e0865f1be7e2726e6986cb775c1eb99746b9959c64aee8bd675f':
              raise SystemExit('reconstructed ZIP differs from original')
          out=Path('/tmp/v092-assets.zip'); out.write_bytes(data)
          with zipfile.ZipFile(out) as z:
              bad=z.testzip()
              print('zip test bad member:',bad)
              if bad is not None:
                  raise SystemExit(f'bad zip member: {bad}')
              for info in z.infolist():
                  print(info.filename, info.file_size)
          PY
