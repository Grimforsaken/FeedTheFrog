name: Build Feed the Frog v0.9.0 Fake Commercials

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "binary_assets_v11/patch_fake_commercials_v1.py"
      - ".github/workflows/build-fake-commercials-v090.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Accept Android SDK licenses
        shell: bash
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android API 37 and Build-Tools 37
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platform-tools"
          PLATFORM_PACKAGE="$(sdkmanager --list | awk -F'|' '/platforms;android-37(\.0)?[[:space:]]*\|/ {gsub(/[[:space:]]/, "", $1); print $1; exit}')"
          test -n "$PLATFORM_PACKAGE"
          sdkmanager "$PLATFORM_PACKAGE"
          BUILD_TOOLS="$(sdkmanager --list | awk -F'|' '/build-tools;37\./ {gsub(/[[:space:]]/, "", $1); print $1}' | sort -V | tail -n 1)"
          test -n "$BUILD_TOOLS"
          sdkmanager "$BUILD_TOOLS"

      - name: Extract clean Feed the Frog source
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 1 -type f -name 'FeedTheFrog-Android-*.zip' | sort | tail -n 1)"
          test -n "$ZIP_FILE"
          rm -rf extracted
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

      - name: Patch v0.9.0 gameplay and fake commercial system
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_FILE="$(find extracted -type f \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) | head -n 1)"
          PROJECT_DIR="$(dirname "$PROJECT_FILE")"
          MAIN_FILE="$PROJECT_DIR/app/src/main/java/com/feedthefrog/game/MainActivity.kt"
          COMMERCIAL_FILE="$PROJECT_DIR/app/src/main/java/com/feedthefrog/game/CommercialSystem.kt"
          APP_GRADLE="$PROJECT_DIR/app/build.gradle.kts"
          MANIFEST="$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          DRAWABLE_DIR="$PROJECT_DIR/app/src/main/res/drawable-nodpi"
          MIPMAP_DIR="$PROJECT_DIR/app/src/main/res/mipmap-nodpi"

          if [ -f "$PROJECT_DIR/app/src/main/res/raw/catch.ogg" ]; then
            mv "$PROJECT_DIR/app/src/main/res/raw/catch.ogg" "$PROJECT_DIR/app/src/main/res/raw/catch_sound.ogg"
            sed -i 's/R\.raw\.catch/R.raw.catch_sound/g' "$MAIN_FILE"
          fi

          sed -i '/^import androidx\.compose\.foundation\.layout\.weight$/d' "$MAIN_FILE"
          python3 "$GITHUB_WORKSPACE/patch_tap_game.py" "$MAIN_FILE"
          python3 "$GITHUB_WORKSPACE/patch_gameplay_v2.py" "$MAIN_FILE"
          python3 "$GITHUB_WORKSPACE/patch_ui_art_costs.py" "$MAIN_FILE" "$PROJECT_DIR"
          python3 "$GITHUB_WORKSPACE/patch_tv_subscription.py" "$MAIN_FILE" "$PROJECT_DIR"
          python3 "$GITHUB_WORKSPACE/patch_gameplay_v3.py" "$MAIN_FILE" "$PROJECT_DIR"
          python3 "$GITHUB_WORKSPACE/patch_gameplay_v4.py" "$MAIN_FILE"
          python3 "$GITHUB_WORKSPACE/patch_gameplay_v5.py" "$MAIN_FILE" "$PROJECT_DIR"
          python3 "$GITHUB_WORKSPACE/prepare_v8_assets.py"
          python3 "$GITHUB_WORKSPACE/patch_v6_preflight.py" "$MAIN_FILE"
          python3 "$GITHUB_WORKSPACE/patch_gameplay_v6.py" "$MAIN_FILE" "$PROJECT_DIR"
          python3 "$GITHUB_WORKSPACE/patch_tv_v2.py" "$MAIN_FILE" "$PROJECT_DIR"
          python3 "$GITHUB_WORKSPACE/patch_compile_fix.py" "$MAIN_FILE"
          python3 "$GITHUB_WORKSPACE/prepare_v9_assets.py"
          python3 "$GITHUB_WORKSPACE/patch_gameplay_v7.py" "$MAIN_FILE" "$PROJECT_DIR"
          python3 "$GITHUB_WORKSPACE/prepare_v11_assets.py"
          python3 "$GITHUB_WORKSPACE/patch_gameplay_v8.py" "$MAIN_FILE" "$PROJECT_DIR"
          python3 "$GITHUB_WORKSPACE/patch_home_final.py" "$MAIN_FILE"
          python3 "$GITHUB_WORKSPACE/patch_home_png_resource.py" "$PROJECT_DIR"
          python3 "$GITHUB_WORKSPACE/binary_assets_v11/patch_fake_commercials_v1.py" "$MAIN_FILE" "$PROJECT_DIR"

          python3 "$GITHUB_WORKSPACE/prepare_v10_assets.py"
          mkdir -p "$DRAWABLE_DIR" "$MIPMAP_DIR"
          cp "$GITHUB_WORKSPACE/generated_assets_v10/ftf_home_frog.png" "$DRAWABLE_DIR/ftf_home_frog.png"
          cp "$GITHUB_WORKSPACE/generated_assets_v10/frog_helmet.png" "$DRAWABLE_DIR/frog_helmet.png"
          cp "$GITHUB_WORKSPACE/generated_assets_v10/ftf_poison_frog.png" "$DRAWABLE_DIR/ftf_poison_frog.png"
          rm -f "$DRAWABLE_DIR/ftf_home_frog.webp" "$DRAWABLE_DIR/frog_helmet.webp" "$DRAWABLE_DIR/ftf_poison_frog.webp"
          cp "$DRAWABLE_DIR/ftf_home_frog.png" "$MIPMAP_DIR/ftf_launcher.png"
          sed -i 's#android:icon="@drawable/ftf_home_frog"#android:icon="@mipmap/ftf_launcher"#' "$MANIFEST"
          sed -i 's#android:roundIcon="@drawable/ftf_home_frog"#android:roundIcon="@mipmap/ftf_launcher"#' "$MANIFEST"

          # New fake-commercial architecture and UI.
          test -s "$COMMERCIAL_FILE"
          grep -q 'versionCode = 19' "$APP_GRADLE"
          grep -q 'versionName = "0.9.0-fake-commercials"' "$APP_GRADLE"
          grep -q 'class CommercialBreakManager' "$COMMERCIAL_FILE"
          grep -q 'class FakeCommercialProvider' "$COMMERCIAL_FILE"
          grep -q 'data class FakeCommercial' "$COMMERCIAL_FILE"
          grep -q 'data class TvContent' "$COMMERCIAL_FILE"
          grep -q 'enum class TvContentType' "$COMMERCIAL_FILE"
          grep -q 'Frog Cola' "$COMMERCIAL_FILE"
          grep -q 'Bug Burger' "$COMMERCIAL_FILE"
          grep -q 'Lily Pad Insurance' "$COMMERCIAL_FILE"
          grep -q 'Commercial Break' "$COMMERCIAL_FILE"
          grep -q 'Pond Loop' "$COMMERCIAL_FILE"
          grep -q 'Loop 2' "$COMMERCIAL_FILE"
          grep -q 'Loop 3' "$COMMERCIAL_FILE"
          grep -q 'premiumOwned' "$MAIN_FILE"
          grep -q 'selectedTvContent' "$MAIN_FILE"
          grep -q 'VISIT ADVERTISER' "$MAIN_FILE"
          grep -q 'SUBSCRIPTION SERVICE' "$MAIN_FILE"
          grep -q 'CHANGE TV' "$MAIN_FILE"
          grep -q 'Test advertiser link — no real website opened.' "$MAIN_FILE"
          grep -q 'keepFlyOutsideProtectedControls' "$MAIN_FILE"
          grep -q 'isInProtectedControlArea' "$MAIN_FILE"
          grep -q 'FakeCommercialScreen' "$MAIN_FILE"

          # No real advertising, purchase, analytics, or advertiser-link SDKs.
          if grep -RniE 'play-services-ads|com\.google\.android\.gms\.ads|AdMob|Anzu' "$PROJECT_DIR/app"; then
            echo 'Real ad SDK/reference found in fake-commercial build' >&2
            exit 1
          fi

          # Preserve all prior gameplay systems.
          grep -q 'autoEatEnabled = false' "$MAIN_FILE"
          if grep -q 'title = "Auto-Eat (Mid Range)"' "$MAIN_FILE"; then
            echo 'Auto-Eat shop card still present' >&2
            exit 1
          fi
          grep -q 'TIMER_SKIP_COST = 1' "$MAIN_FILE"
          grep -q 'UpgradeKind.TIMER_SKIP' "$MAIN_FILE"
          grep -q 'title = "Timer Skip"' "$MAIN_FILE"
          grep -q 'BEE_IMMUNITY_COST = 1' "$MAIN_FILE"
          grep -q 'FIREFLY_IMMUNITY_COST = 1' "$MAIN_FILE"
          grep -q 'BUG_UNLOCK_COST = 1' "$MAIN_FILE"
          grep -q 'FIREFLY_DAMAGE_PER_SECOND = 5' "$MAIN_FILE"
          grep -q 'POISON_DAMAGE_PER_SECOND = 3' "$MAIN_FILE"
          grep -q 'Fast, long, hard-to-predict darts' "$MAIN_FILE"
          grep -q 'Hummingbird-like micro-darts' "$MAIN_FILE"
          grep -q 'Quick looping arcs' "$MAIN_FILE"
          grep -q 'Deliberately slow, broad loops' "$MAIN_FILE"
          grep -q 'Fast, sharp zigzags' "$MAIN_FILE"
          grep -q 'Poison bugs intentionally use the exact normal-fly motion' "$MAIN_FILE"
          grep -q 'private fun UpgradeChallengeOverlayFixed' "$MAIN_FILE"
          grep -q 'Bee immunity face mask' "$MAIN_FILE"

          # Preserve validated homepage and all three silent local TV loops.
          test -s "$DRAWABLE_DIR/ftf_home_screen_v2.png"
          test ! -e "$DRAWABLE_DIR/ftf_home_screen_v2.jpg"
          ffmpeg -v error -i "$DRAWABLE_DIR/ftf_home_screen_v2.png" -f null -
          test -s "$PROJECT_DIR/app/src/main/res/raw/subscription_pond.webm"
          test -s "$PROJECT_DIR/app/src/main/res/raw/subscription_meadow.mp4"
          test -s "$PROJECT_DIR/app/src/main/res/raw/subscription_skunk.mp4"
          for name in subscription_meadow subscription_skunk; do
            test "$(ffprobe -v error -select_streams a -show_entries stream=index -of csv=p=0 "$PROJECT_DIR/app/src/main/res/raw/${name}.mp4" | wc -l)" -eq 0
          done

          test -s "$DRAWABLE_DIR/ftf_home_frog.png"
          test -s "$DRAWABLE_DIR/frog_helmet.png"
          test -s "$DRAWABLE_DIR/ftf_poison_frog.png"
          test -s "$MIPMAP_DIR/ftf_launcher.png"
          test -s "$DRAWABLE_DIR/bug_firefly.webp"
          test -s "$DRAWABLE_DIR/bug_poison_fly.webp"
          test -s "$DRAWABLE_DIR/rain_cloud_0.webp"
          grep -q 'android:icon="@mipmap/ftf_launcher"' "$MANIFEST"

          rm -rf "$PROJECT_DIR/.gradle" "$PROJECT_DIR/app/build"

      - name: Build v0.9.0 APK
        id: build
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          PROJECT_FILE="$(find extracted -type f \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) | head -n 1)"
          PROJECT_DIR="$(dirname "$PROJECT_FILE")"
          cd "$PROJECT_DIR"
          gradle --no-daemon --console=plain --stacktrace clean :app:assembleDebug 2>&1 | tee "$GITHUB_WORKSPACE/build-error-v090.log"

      - name: Verify and preserve v0.9.0 APK
        if: steps.build.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          APK_FILE="$(find extracted -type f -path '*/app/build/outputs/apk/debug/app-debug.apk' | head -n 1)"
          test -s "$APK_FILE"
          unzip -l "$APK_FILE" > apk-contents-v090.txt
          grep -q 'res/raw/subscription_pond.webm' apk-contents-v090.txt
          grep -q 'res/raw/subscription_meadow.mp4' apk-contents-v090.txt
          grep -q 'res/raw/subscription_skunk.mp4' apk-contents-v090.txt
          grep -q 'drawable-nodpi-v4/ftf_home_screen_v2.png' apk-contents-v090.txt
          if grep -q 'drawable-nodpi-v4/ftf_home_screen_v2.jpg' apk-contents-v090.txt; then
            echo 'Obsolete homepage JPEG was packaged' >&2
            exit 1
          fi
          grep -q 'drawable-nodpi-v4/ftf_home_frog.png' apk-contents-v090.txt
          grep -q 'drawable-nodpi-v4/frog_helmet.png' apk-contents-v090.txt
          grep -q 'drawable-nodpi-v4/ftf_poison_frog.png' apk-contents-v090.txt
          grep -q 'mipmap-nodpi-v4/ftf_launcher.png' apk-contents-v090.txt

          unzip -p "$APK_FILE" 'res/drawable-nodpi-v4/ftf_home_screen_v2.png' > /tmp/apk-home-v090.png
          ffmpeg -v error -i /tmp/apk-home-v090.png -f null -
          for name in subscription_meadow subscription_skunk; do
            unzip -p "$APK_FILE" "res/raw/${name}.mp4" > "/tmp/${name}-v090.mp4"
            test "$(ffprobe -v error -select_streams a -show_entries stream=index -of csv=p=0 "/tmp/${name}-v090.mp4" | wc -l)" -eq 0
            test "$(ffprobe -v error -select_streams v -show_entries stream=index -of csv=p=0 "/tmp/${name}-v090.mp4" | wc -l)" -ge 1
          done

          cp "$APK_FILE" /tmp/FeedTheFrog-TV-v0.9.0-fake-commercials.apk
          sha256sum /tmp/FeedTheFrog-TV-v0.9.0-fake-commercials.apk
          echo "Verified v0.9.0 APK size: $(stat -c%s /tmp/FeedTheFrog-TV-v0.9.0-fake-commercials.apk)"

      - name: Stop after failed build
        if: steps.build.outcome == 'failure'
        shell: bash
        run: |
          cat build-error-v090.log || true
          exit 1

      - name: Upload verified v0.9.0 APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: FeedTheFrog-TV-v0.9.0-fake-commercials
          path: /tmp/FeedTheFrog-TV-v0.9.0-fake-commercials.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish v0.9.0 as latest APK
        if: steps.build.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/FeedTheFrog-TV-v0.9.0-fake-commercials.apk FeedTheFrog-latest.apk
          git add -f FeedTheFrog-latest.apk
          git commit -m "Publish FeedTheFrog v0.9.0 fake commercials APK [skip ci]" || true
          git push origin HEAD:main
