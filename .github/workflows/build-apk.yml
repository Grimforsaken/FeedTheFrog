name: Build Feed the Frog APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        shell: bash
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android API 37 and Build-Tools 37
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platform-tools"

          PLATFORM_PACKAGE="$(sdkmanager --list \
            | awk -F'|' '/platforms;android-37(\.0)?[[:space:]]*\|/ {gsub(/[[:space:]]/, "", $1); print $1; exit}')"

          if [ -z "$PLATFORM_PACKAGE" ]; then
            echo "Android API 37 platform package was not found by sdkmanager."
            sdkmanager --list | grep 'platforms;android-37' || true
            exit 1
          fi

          sdkmanager "$PLATFORM_PACKAGE"

          BUILD_TOOLS="$(sdkmanager --list \
            | awk -F'|' '/build-tools;37\./ {gsub(/[[:space:]]/, "", $1); print $1}' \
            | sort -V \
            | tail -n 1)"

          if [ -z "$BUILD_TOOLS" ]; then
            echo "No Android Build-Tools 37.x.x package was found."
            exit 1
          fi

          sdkmanager "$BUILD_TOOLS"

      - name: Set up Gradle 9.7.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.1"

      - name: Find Feed the Frog ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 1 -type f -name 'FeedTheFrog-Android-*.zip' | sort | tail -n 1)"
          if [ -z "$ZIP_FILE" ]; then
            echo "Feed the Frog ZIP was not found."
            exit 1
          fi
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"
          echo "Using $ZIP_FILE"

      - name: Extract project
        shell: bash
        run: |
          rm -rf extracted
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_FILE="$(find extracted -type f \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) | head -n 1)"
          if [ -z "$PROJECT_FILE" ]; then
            echo "Could not find the Android project after extracting the ZIP."
            exit 1
          fi
          PROJECT_DIR="$(dirname "$PROJECT_FILE")"
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FeedTheFrog-v0.7.2-debug-apk
          path: extracted/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
