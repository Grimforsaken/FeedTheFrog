name: Build Feed the Frog APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "build-error.log"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        shell: bash
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android API 37 and Build-Tools 37
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platform-tools"

          PLATFORM_PACKAGE="$(sdkmanager --list \
            | awk -F'|' '/platforms;android-37(\.0)?[[:space:]]*\|/ {gsub(/[[:space:]]/, "", $1); print $1; exit}')"

          if [ -z "$PLATFORM_PACKAGE" ]; then
            echo "Android API 37 platform package was not found by sdkmanager."
            sdkmanager --list | grep 'platforms;android-37' || true
            exit 1
          fi

          sdkmanager "$PLATFORM_PACKAGE"

          BUILD_TOOLS="$(sdkmanager --list \
            | awk -F'|' '/build-tools;37\./ {gsub(/[[:space:]]/, "", $1); print $1}' \
            | sort -V \
            | tail -n 1)"

          if [ -z "$BUILD_TOOLS" ]; then
            echo "No Android Build-Tools 37.x.x package was found."
            exit 1
          fi

          sdkmanager "$BUILD_TOOLS"

      - name: Set up Gradle 9.7.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.1"

      - name: Find Feed the Frog ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 1 -type f -name 'FeedTheFrog-Android-*.zip' | sort | tail -n 1)"
          if [ -z "$ZIP_FILE" ]; then
            echo "Feed the Frog ZIP was not found."
            exit 1
          fi
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"
          echo "Using $ZIP_FILE"

      - name: Extract project
        shell: bash
        run: |
          rm -rf extracted
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

      - name: Patch reserved Android resource name
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_FILE="$(find extracted -type f \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) | head -n 1)"
          PROJECT_DIR="$(dirname "$PROJECT_FILE")"
          if [ -f "$PROJECT_DIR/app/src/main/res/raw/catch.ogg" ]; then
            mv "$PROJECT_DIR/app/src/main/res/raw/catch.ogg" "$PROJECT_DIR/app/src/main/res/raw/catch_sound.ogg"
            sed -i 's/R\.raw\.catch/R.raw.catch_sound/g' "$PROJECT_DIR/app/src/main/java/com/feedthefrog/game/MainActivity.kt"
          fi

      - name: Build APK
        id: build
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          PROJECT_FILE="$(find extracted -type f \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) | head -n 1)"
          if [ -z "$PROJECT_FILE" ]; then
            echo "Could not find the Android project after extracting the ZIP." | tee build-error.log
            exit 1
          fi
          PROJECT_DIR="$(dirname "$PROJECT_FILE")"
          cd "$PROJECT_DIR"
          gradle --no-daemon --console=plain --stacktrace :app:assembleDebug 2>&1 | tee "$GITHUB_WORKSPACE/build-error.log"

      - name: Save failure log to repository
        if: steps.build.outcome == 'failure'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build-error.log
          git commit -m "Save latest Android build error [skip ci]" || true
          git push

      - name: Stop after failed build
        if: steps.build.outcome == 'failure'
        shell: bash
        run: exit 1

      - name: Remove stale failure log
        if: steps.build.outcome == 'success'
        shell: bash
        run: |
          if [ -f build-error.log ]; then
            rm build-error.log
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Remove resolved Android build error [skip ci]" || true
            git push || true
          fi

      - name: Upload APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: FeedTheFrog-v0.7.2-debug-apk
          path: extracted/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
