name: Build Feed the Frog APK
# v0.8.8: new full home screen, species-specific movement, and Timer Skip upgrade.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "build-error.log"
      - "latest-run.txt"
      - "FeedTheFrog-latest.apk"
      - "binary_assets/**"
      - "binary_assets_v9/**"
      - "binary_assets_v10/**"
      - "prepare_v8_assets.py"
      - "prepare_v9_assets.py"
      - "prepare_v10_assets.py"
      - "prepare_v11_assets.py"
      - "patch_gameplay_v6.py"
      - "patch_gameplay_v7.py"
      - "patch_gameplay_v8.py"
      - "patch_tv_v2.py"
      - "ui_assets/**"
      - "tv_assets/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Record latest workflow run
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$GITHUB_RUN_ID" > latest-run.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest-run.txt
          git commit -m "Record latest FeedTheFrog workflow run [skip ci]" || true
          git push origin HEAD:main || true

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Accept Android SDK licenses
        shell: bash
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android API 37 and Build-Tools 37
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platform-tools"
          PLATFORM_PACKAGE="$(sdkmanager --list | awk -F'|' '/platforms;android-37(\.0)?[[:space:]]*\|/ {gsub(/[[:space:]]/, "", $1); print $1; exit}')"
          test -n "$PLATFORM_PACKAGE"
          sdkmanager "$PLATFORM_PACKAGE"
          BUILD_TOOLS="$(sdkmanager --list | awk -F'|' '/build-tools;37\./ {gsub(/[[:space:]]/, "", $1); print $1}' | sort -V | tail -n 1)"
          test -n "$BUILD_TOOLS"
          sdkmanager "$BUILD_TOOLS"

      - name: Find and extract Feed the Frog project
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 1 -type f -name 'FeedTheFrog-Android-*.zip' | sort | tail -n 1)"
          test -n "$ZIP_FILE"
          rm -rf extracted
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

      - name: Patch v0.8.8 gameplay and art
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_FILE="$(find extracted -type f \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) | head -n 1)"
          PROJECT_DIR="$(dirname "$PROJECT_FILE")"
          MAIN_FILE="$PROJECT_DIR/app/src/main/java/com/feedthefrog/game/MainActivity.kt"
          APP_GRADLE="$PROJECT_DIR/app/build.gradle.kts"
          MANIFEST="$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          DRAWABLE_DIR="$PROJECT_DIR/app/src/main/res/drawable-nodpi"
          MIPMAP_DIR="$PROJECT_DIR/app/src/main/res/mipmap-nodpi"

          if [ -f "$PROJECT_DIR/app/src/main/res/raw/catch.ogg" ]; then
            mv "$PROJECT_DIR/app/src/main/res/raw/catch.ogg" "$PROJECT_DIR/app/src/main/res/raw/catch_sound.ogg"
            sed -i 's/R\.raw\.catch/R.raw.catch_sound/g' "$MAIN_FILE"
          fi

          sed -i '/^import androidx\.compose\.foundation\.layout\.weight$/d' "$MAIN_FILE"
          python3 "$GITHUB_WORKSPACE/patch_tap_game.py" "$MAIN_FILE"
          python3 "$GITHUB_WORKSPACE/patch_gameplay_v2.py" "$MAIN_FILE"
          python3 "$GITHUB_WORKSPACE/patch_ui_art_costs.py" "$MAIN_FILE" "$PROJECT_DIR"
          python3 "$GITHUB_WORKSPACE/patch_tv_subscription.py" "$MAIN_FILE" "$PROJECT_DIR"
          python3 "$GITHUB_WORKSPACE/patch_gameplay_v3.py" "$MAIN_FILE" "$PROJECT_DIR"
          python3 "$GITHUB_WORKSPACE/patch_gameplay_v4.py" "$MAIN_FILE"
          python3 "$GITHUB_WORKSPACE/patch_gameplay_v5.py" "$MAIN_FILE" "$PROJECT_DIR"
          python3 "$GITHUB_WORKSPACE/prepare_v8_assets.py"
          python3 "$GITHUB_WORKSPACE/patch_v6_preflight.py" "$MAIN_FILE"
          python3 "$GITHUB_WORKSPACE/patch_gameplay_v6.py" "$MAIN_FILE" "$PROJECT_DIR"
          python3 "$GITHUB_WORKSPACE/patch_tv_v2.py" "$MAIN_FILE" "$PROJECT_DIR"
          python3 "$GITHUB_WORKSPACE/patch_compile_fix.py" "$MAIN_FILE"

          python3 "$GITHUB_WORKSPACE/prepare_v9_assets.py"
          python3 "$GITHUB_WORKSPACE/patch_gameplay_v7.py" "$MAIN_FILE" "$PROJECT_DIR"

          # Reconstruct and install the user's new full portrait home screen, then
          # apply all movement profiles and the Timer Skip upgrade after v7.
          python3 "$GITHUB_WORKSPACE/prepare_v11_assets.py"
          python3 "$GITHUB_WORKSPACE/patch_gameplay_v8.py" "$MAIN_FILE" "$PROJECT_DIR"

          # Reconstruct the validated PNG frog/mask assets used by gameplay and launcher.
          python3 "$GITHUB_WORKSPACE/prepare_v10_assets.py"
          mkdir -p "$DRAWABLE_DIR" "$MIPMAP_DIR"
          cp "$GITHUB_WORKSPACE/generated_assets_v10/ftf_home_frog.png" "$DRAWABLE_DIR/ftf_home_frog.png"
          cp "$GITHUB_WORKSPACE/generated_assets_v10/frog_helmet.png" "$DRAWABLE_DIR/frog_helmet.png"
          cp "$GITHUB_WORKSPACE/generated_assets_v10/ftf_poison_frog.png" "$DRAWABLE_DIR/ftf_poison_frog.png"
          rm -f "$DRAWABLE_DIR/ftf_home_frog.webp" "$DRAWABLE_DIR/frog_helmet.webp" "$DRAWABLE_DIR/ftf_poison_frog.webp"

          cp "$DRAWABLE_DIR/ftf_home_frog.png" "$MIPMAP_DIR/ftf_launcher.png"
          sed -i 's#android:icon="@drawable/ftf_home_frog"#android:icon="@mipmap/ftf_launcher"#' "$MANIFEST"
          sed -i 's#android:roundIcon="@drawable/ftf_home_frog"#android:roundIcon="@mipmap/ftf_launcher"#' "$MANIFEST"

          # Auto-Eat remains removed.
          grep -q 'autoEatEnabled = false' "$MAIN_FILE"
          if grep -q 'title = "Auto-Eat (Mid Range)"' "$MAIN_FILE"; then
            echo 'Auto-Eat shop card still present' >&2
            exit 1
          fi

          # v0.8.8 code and resource checks before compilation.
          grep -q 'versionCode = 17' "$APP_GRADLE"
          grep -q 'versionName = "0.8.8-home-motion-timer-skip"' "$APP_GRADLE"
          grep -q 'TIMER_SKIP_COST = 1' "$MAIN_FILE"
          grep -q 'UpgradeKind.TIMER_SKIP' "$MAIN_FILE"
          grep -q 'title = "Timer Skip"' "$MAIN_FILE"
          grep -q 'R.drawable.ftf_home_screen_v2' "$MAIN_FILE"
          grep -q 'Fast, long, hard-to-predict darts' "$MAIN_FILE"
          grep -q 'Hummingbird-like micro-darts' "$MAIN_FILE"
          grep -q 'Quick looping arcs' "$MAIN_FILE"
          grep -q 'Deliberately slow, broad loops' "$MAIN_FILE"
          grep -q 'Fast, sharp zigzags' "$MAIN_FILE"
          grep -q 'Poison bugs intentionally use the exact normal-fly motion' "$MAIN_FILE"
          test -s "$DRAWABLE_DIR/ftf_home_screen_v2.jpg"

          # Preserve all prior systems and media.
          grep -q 'BEE_IMMUNITY_COST = 1' "$MAIN_FILE"
          grep -q 'FIREFLY_IMMUNITY_COST = 1' "$MAIN_FILE"
          grep -q 'BUG_UNLOCK_COST = 1' "$MAIN_FILE"
          grep -q 'FIREFLY_DAMAGE_PER_SECOND = 5' "$MAIN_FILE"
          grep -q 'POISON_DAMAGE_PER_SECOND = 3' "$MAIN_FILE"
          grep -q 'TV: MEADOW' "$MAIN_FILE"
          grep -q 'TV: SKUNK WALK' "$MAIN_FILE"
          grep -q 'private fun UpgradeChallengeOverlayFixed' "$MAIN_FILE"
          grep -q 'Bee immunity face mask' "$MAIN_FILE"
          grep -q 'android:icon="@mipmap/ftf_launcher"' "$MANIFEST"

          test -s "$DRAWABLE_DIR/ftf_home_frog.png"
          test -s "$DRAWABLE_DIR/frog_helmet.png"
          test -s "$DRAWABLE_DIR/ftf_poison_frog.png"
          test -s "$MIPMAP_DIR/ftf_launcher.png"
          test -s "$DRAWABLE_DIR/bug_firefly.webp"
          test -s "$DRAWABLE_DIR/bug_poison_fly.webp"
          test -s "$DRAWABLE_DIR/rain_cloud_0.webp"
          test -s "$PROJECT_DIR/app/src/main/res/raw/subscription_pond.webm"
          test -s "$PROJECT_DIR/app/src/main/res/raw/subscription_meadow.mp4"
          test -s "$PROJECT_DIR/app/src/main/res/raw/subscription_skunk.mp4"

          python3 - <<PY
          from pathlib import Path
          import struct
          pngs = [
              Path(r'$DRAWABLE_DIR/ftf_home_frog.png'),
              Path(r'$DRAWABLE_DIR/frog_helmet.png'),
              Path(r'$DRAWABLE_DIR/ftf_poison_frog.png'),
              Path(r'$MIPMAP_DIR/ftf_launcher.png'),
          ]
          for p in pngs:
              data=p.read_bytes()
              assert data.startswith(b'\x89PNG\r\n\x1a\n'), p
              w,h=struct.unpack('>II', data[16:24])
              assert w > 0 and h > 0, p
              print(f'validated {p.name}: {len(data)} bytes {w}x{h}')
          home = Path(r'$DRAWABLE_DIR/ftf_home_screen_v2.jpg').read_bytes()
          assert home.startswith(b'\xff\xd8') and home.endswith(b'\xff\xd9')
          print(f'validated ftf_home_screen_v2.jpg: {len(home)} bytes')
          PY

          rm -rf "$PROJECT_DIR/.gradle" "$PROJECT_DIR/app/build"

      - name: Build APK from clean source
        id: build
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          PROJECT_FILE="$(find extracted -type f \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) | head -n 1)"
          PROJECT_DIR="$(dirname "$PROJECT_FILE")"
          cd "$PROJECT_DIR"
          gradle --no-daemon --console=plain --stacktrace clean :app:assembleDebug 2>&1 | tee "$GITHUB_WORKSPACE/build-error.log"

      - name: Verify and preserve v0.8.8 APK
        if: steps.build.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          APK_FILE="$(find extracted -type f -path '*/app/build/outputs/apk/debug/app-debug.apk' | head -n 1)"
          test -s "$APK_FILE"
          unzip -l "$APK_FILE" > apk-contents.txt
          grep -q 'res/raw/subscription_pond.webm' apk-contents.txt
          grep -q 'res/raw/subscription_meadow.mp4' apk-contents.txt
          grep -q 'res/raw/subscription_skunk.mp4' apk-contents.txt
          grep -q 'drawable-nodpi-v4/ftf_home_screen_v2.jpg' apk-contents.txt
          grep -q 'drawable-nodpi-v4/ftf_home_frog.png' apk-contents.txt
          grep -q 'drawable-nodpi-v4/frog_helmet.png' apk-contents.txt
          grep -q 'drawable-nodpi-v4/ftf_poison_frog.png' apk-contents.txt
          grep -q 'mipmap-nodpi-v4/ftf_launcher.png' apk-contents.txt
          grep -q 'bug_firefly' apk-contents.txt
          grep -q 'bug_poison_fly' apk-contents.txt

          unzip -p "$APK_FILE" 'res/drawable-nodpi-v4/ftf_home_screen_v2.jpg' > /tmp/apk-home-v2.jpg
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/apk-home-v2.jpg')
          data = p.read_bytes()
          assert data.startswith(b'\xff\xd8') and data.endswith(b'\xff\xd9')
          print(f'APK home screen verified: {len(data)} bytes')
          PY

          cp "$APK_FILE" /tmp/FeedTheFrog-TV-v0.8.8.apk
          echo "Verified v0.8.8 APK size: $(stat -c%s /tmp/FeedTheFrog-TV-v0.8.8.apk)"

      - name: Save failure log to repository
        if: steps.build.outcome == 'failure'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build-error.log
          git commit -m "Save latest Android build error [skip ci]" || true
          git fetch origin main
          git rebase origin/main || true
          git push origin HEAD:main || true

      - name: Stop after failed build
        if: steps.build.outcome == 'failure'
        shell: bash
        run: exit 1

      - name: Upload verified APK artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: FeedTheFrog-TV-v0.8.8-home-motion-timer-skip
          path: /tmp/FeedTheFrog-TV-v0.8.8.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish permanent APK file
        if: steps.build.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/FeedTheFrog-TV-v0.8.8.apk FeedTheFrog-latest.apk
          git add -f FeedTheFrog-latest.apk
          git commit -m "Publish FeedTheFrog v0.8.8 APK [skip ci]" || true
          git push origin HEAD:main
