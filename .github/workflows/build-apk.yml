name: Build Feed the Frog APK
# v0.8.4 clean rebuild after repairing generated multiline patch literals

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "build-error.log"
      - "latest-run.txt"
      - "FeedTheFrog-latest.apk"
      - "binary_assets/**"
      - "prepare_v8_assets.py"
      - "patch_gameplay_v6.py"
      - "patch_tv_v2.py"
      - "ui_assets/**"
      - "tv_assets/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Record latest workflow run
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$GITHUB_RUN_ID" > latest-run.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest-run.txt
          git commit -m "Record latest FeedTheFrog workflow run [skip ci]" || true
          git push origin HEAD:main || true

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Accept Android SDK licenses
        shell: bash
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android API 37 and Build-Tools 37
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platform-tools"
          PLATFORM_PACKAGE="$(sdkmanager --list | awk -F'|' '/platforms;android-37(\.0)?[[:space:]]*\|/ {gsub(/[[:space:]]/, "", $1); print $1; exit}')"
          test -n "$PLATFORM_PACKAGE"
          sdkmanager "$PLATFORM_PACKAGE"
          BUILD_TOOLS="$(sdkmanager --list | awk -F'|' '/build-tools;37\./ {gsub(/[[:space:]]/, "", $1); print $1}' | sort -V | tail -n 1)"
          test -n "$BUILD_TOOLS"
          sdkmanager "$BUILD_TOOLS"

      - name: Find and extract Feed the Frog project
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 1 -type f -name 'FeedTheFrog-Android-*.zip' | sort | tail -n 1)"
          test -n "$ZIP_FILE"
          rm -rf extracted
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

      - name: Patch v0.8.4 gameplay, art, immunities, and all 3 TV videos
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_FILE="$(find extracted -type f \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) | head -n 1)"
          PROJECT_DIR="$(dirname "$PROJECT_FILE")"
          MAIN_FILE="$PROJECT_DIR/app/src/main/java/com/feedthefrog/game/MainActivity.kt"
          APP_GRADLE="$PROJECT_DIR/app/build.gradle.kts"

          if [ -f "$PROJECT_DIR/app/src/main/res/raw/catch.ogg" ]; then
            mv "$PROJECT_DIR/app/src/main/res/raw/catch.ogg" "$PROJECT_DIR/app/src/main/res/raw/catch_sound.ogg"
            sed -i 's/R\.raw\.catch/R.raw.catch_sound/g' "$MAIN_FILE"
          fi

          sed -i '/^import androidx\.compose\.foundation\.layout\.weight$/d' "$MAIN_FILE"
          python3 "$GITHUB_WORKSPACE/patch_tap_game.py" "$MAIN_FILE"
          python3 "$GITHUB_WORKSPACE/patch_gameplay_v2.py" "$MAIN_FILE"
          python3 "$GITHUB_WORKSPACE/patch_ui_art_costs.py" "$MAIN_FILE" "$PROJECT_DIR"
          python3 "$GITHUB_WORKSPACE/patch_tv_subscription.py" "$MAIN_FILE" "$PROJECT_DIR"
          python3 "$GITHUB_WORKSPACE/patch_gameplay_v3.py" "$MAIN_FILE" "$PROJECT_DIR"
          python3 "$GITHUB_WORKSPACE/patch_gameplay_v4.py" "$MAIN_FILE"
          python3 "$GITHUB_WORKSPACE/patch_gameplay_v5.py" "$MAIN_FILE" "$PROJECT_DIR"
          python3 "$GITHUB_WORKSPACE/prepare_v8_assets.py"
          python3 "$GITHUB_WORKSPACE/patch_v6_preflight.py" "$MAIN_FILE"
          python3 "$GITHUB_WORKSPACE/patch_gameplay_v6.py" "$MAIN_FILE" "$PROJECT_DIR"
          python3 "$GITHUB_WORKSPACE/patch_tv_v2.py" "$MAIN_FILE" "$PROJECT_DIR"

          sed -i 's/versionCode = 8/versionCode = 13/' "$APP_GRADLE"
          sed -i 's/versionName = "0.7.2"/versionName = "0.8.4-dev-bugs-tv3"/' "$APP_GRADLE"

          grep -q 'BEE_IMMUNITY_COST = 1' "$MAIN_FILE"
          grep -q 'FIREFLY_IMMUNITY_COST = 1' "$MAIN_FILE"
          grep -q 'BUG_UNLOCK_COST = 1' "$MAIN_FILE"
          grep -q 'FIREFLY_DAMAGE_PER_SECOND = 5' "$MAIN_FILE"
          grep -q 'POISON_DAMAGE_PER_SECOND = 3' "$MAIN_FILE"
          grep -q 'TV: MEADOW' "$MAIN_FILE"
          grep -q 'TV: SKUNK WALK' "$MAIN_FILE"
          test -s "$PROJECT_DIR/app/src/main/res/drawable-nodpi/frog_helmet.webp"
          test -s "$PROJECT_DIR/app/src/main/res/drawable-nodpi/bug_firefly.webp"
          test -s "$PROJECT_DIR/app/src/main/res/drawable-nodpi/bug_poison_fly.webp"
          test -s "$PROJECT_DIR/app/src/main/res/drawable-nodpi/rain_cloud_0.webp"
          test -s "$PROJECT_DIR/app/src/main/res/raw/subscription_pond.webm"
          test -s "$PROJECT_DIR/app/src/main/res/raw/subscription_meadow.mp4"
          test -s "$PROJECT_DIR/app/src/main/res/raw/subscription_skunk.mp4"
          rm -rf "$PROJECT_DIR/.gradle" "$PROJECT_DIR/app/build"

      - name: Build APK from clean source
        id: build
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          PROJECT_FILE="$(find extracted -type f \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) | head -n 1)"
          PROJECT_DIR="$(dirname "$PROJECT_FILE")"
          cd "$PROJECT_DIR"
          gradle --no-daemon --console=plain --stacktrace clean :app:assembleDebug 2>&1 | tee "$GITHUB_WORKSPACE/build-error.log"

      - name: Verify and preserve v0.8.4 APK
        if: steps.build.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          APK_FILE="$(find extracted -type f -path '*/app/build/outputs/apk/debug/app-debug.apk' | head -n 1)"
          unzip -l "$APK_FILE" > apk-contents.txt
          grep -q 'res/raw/subscription_pond.webm' apk-contents.txt
          grep -q 'res/raw/subscription_meadow.mp4' apk-contents.txt
          grep -q 'res/raw/subscription_skunk.mp4' apk-contents.txt
          grep -q 'frog_helmet' apk-contents.txt
          grep -q 'bug_firefly' apk-contents.txt
          grep -q 'bug_poison_fly' apk-contents.txt
          cp "$APK_FILE" /tmp/FeedTheFrog-TV-v0.8.4.apk
          echo "Verified v0.8.4 APK size: $(stat -c%s /tmp/FeedTheFrog-TV-v0.8.4.apk)"

      - name: Save failure log to repository
        if: steps.build.outcome == 'failure'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build-error.log
          git commit -m "Save latest Android build error [skip ci]" || true
          git push origin HEAD:main || true

      - name: Stop after failed build
        if: steps.build.outcome == 'failure'
        shell: bash
        run: exit 1

      - name: Upload verified APK artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: FeedTheFrog-TV-v0.8.4-dev-bugs-tv3
          path: /tmp/FeedTheFrog-TV-v0.8.4.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish permanent APK file
        if: steps.build.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/FeedTheFrog-TV-v0.8.4.apk FeedTheFrog-latest.apk
          git add -f FeedTheFrog-latest.apk
          git commit -m "Publish FeedTheFrog v0.8.4 bugs and 3 TV videos APK [skip ci]" || true
          git push origin HEAD:main
