name: Build Feed the Frog APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out project
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        shell: bash
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android API 37 and Build-Tools 37
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platform-tools"

          PLATFORM_PACKAGE=$(sdkmanager --list \
            | awk -F'|' '/platforms;android-37(\.0)?[[:space:]]*\|/ {gsub(/[[:space:]]/, "", $1); print $1; exit}')

          if [ -z "$PLATFORM_PACKAGE" ]; then
            echo "Android API 37 platform package was not found by sdkmanager."
            sdkmanager --list | grep 'platforms;android-37' || true
            exit 1
          fi

          echo "Installing $PLATFORM_PACKAGE"
          sdkmanager "$PLATFORM_PACKAGE"

          BUILD_TOOLS=$(sdkmanager --list \
            | awk -F'|' '/build-tools;37\./ {gsub(/[[:space:]]/, "", $1); print $1}' \
            | sort -V \
            | tail -n 1)

          if [ -z "$BUILD_TOOLS" ]; then
            echo "No Android Build-Tools 37.x.x package was found."
            exit 1
          fi

          echo "Installing $BUILD_TOOLS"
          sdkmanager "$BUILD_TOOLS"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK exists
        shell: bash
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Feed the Frog APK
        uses: actions/upload-artifact@v4
        with:
          name: FeedTheFrog-v0.7.2-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
